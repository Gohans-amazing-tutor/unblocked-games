<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <div class="container">
        <header>
            <h1>UNBLOCKED GAMES</h1>
            <p class="tagline">Your Gateway to Fun</p>
        </header>

        <main>
            <section class="games-grid">
                <div class="game-card">
                    <div class="game-icon">🎮</div>
                    <h2>Snake</h2>
                    <p>Classic snake game</p>
                    <button onclick="openGame('snake')">Play</button>
                </div>

                <div class="game-card">
                    <div class="game-icon">🟫</div>
                    <h2>Tetris</h2>
                    <p>Block stacking puzzle</p>
                    <button onclick="openGame('tetris')">Play</button>
                </div>

                <div class="game-card">
                    <div class="game-icon">⚫</div>
                    <h2>Pong</h2>
                    <p>Classic paddle game</p>
                    <button onclick="openGame('pong')">Play</button>
                </div>

                <div class="game-card">
                    <div class="game-icon">💣</div>
                    <h2>Minesweeper</h2>
                    <p>Logic puzzle game</p>
                    <button onclick="openGame('minesweeper')">Play</button>
                </div>

                <div class="game-card">
                    <div class="game-icon">2048</div>
                    <h2>2048</h2>
                    <p>Number sliding puzzle</p>
                    <button onclick="openGame('2048')">Play</button>
                </div>

                <div class="game-card">
                    <div class="game-icon">🃏</div>
                    <h2>Memory</h2>
                    <p>Card matching game</p>
                    <button onclick="openGame('memory')">Play</button>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Unblocked Games. Have fun learning!</p>
        </footer>
    </div>

    <script src="matrix.js"></script>
    <script src="script.js"></script>
</body>
</html>
